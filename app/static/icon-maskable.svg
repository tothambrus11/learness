<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 407 407" role="img" aria-label="Learness">
  <!-- The same mark as icon.svg, on a black square that runs to every edge.
       This is the icon for anything that cuts its own shape out of what it
       is given: Android's launcher (a circle, a squircle) and a connector's
       icon slot. Given the rounded icon, they put it in a white disc or left
       its corners white (#50). The mark is scaled to sit inside the central
       80%, the part every mask keeps. -->
  <rect width="407" height="407" fill="#000000"/>
  <g transform="translate(40.7 40.7) scale(0.8)">
    <path fill="#27EFD7"
          d="M83.0914 45.0093C115.533 45.0093 141.829 71.3304 141.829 103.802V307.561H266.907H325.645V363.316C294.661 356.413 233.733 338.156 179.07 286.006C81.7548 193.171 82.553 67.6141 83.0821 45L83.0914 45.0093Z"/>
  </g>
</svg>
