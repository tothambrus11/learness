<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- The bar the browser paints above the app: the same ground the app uses,
       so the chrome and the page are one surface rather than two. -->
  <meta name="theme-color" content="#eef1f1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <!-- The full-bleed icon: whatever picks it up from here — a tab, a
       connector's icon slot — shows black to the edges, never white corners
       around a rounded plate (#50). The manifest keeps the rounded one for
       the places that draw it as is. -->
  <link rel="icon" href="%sveltekit.assets%/icon-maskable.svg" />
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display:contents">%sveltekit.body%</div>
</body>
</html>
