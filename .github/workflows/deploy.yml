name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: App tests
        working-directory: app
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pipeline
        run: pip install -e . pytest
      - name: Pipeline tests
        run: python -m pytest tests/ -q

  deploy:
    name: Deploy to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build the static app
        working-directory: app
        run: npm run build

      # The catalogue and audio are committed, so the deploy needs no Python and
      # no network beyond Cloudflare. Regenerating them is a separate, manual
      # step: `frcog build && frcog audio && frcog app`.
      - name: Deploy worker and assets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          # Pinned: the action still defaults to Wrangler 3, which predates the
          # [assets] configuration this Worker relies on.
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Check it answers
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$URL" ]; then
            echo "no deployment URL reported; skipping the health check"
            exit 0
          fi
          echo "deployed to $URL"
          for i in $(seq 1 12); do
            if curl -fsS "$URL/v1/health"; then echo; echo "healthy"; exit 0; fi
            sleep 5
          done
          echo "health check never passed at $URL" >&2
          exit 1
