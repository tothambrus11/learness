# Tests, on every push and every pull request. Deployment is Cloudflare's
# job: Workers Builds watches this repo, runs the build command, and then
# the deploy command, which applies the D1 migrations before the Worker goes
# out (`npm run deploy`). That ordering is the point — a Worker that reads a
# table its database has not got yet is an outage, and the first sync after
# the themes went out answered "no such table: themes" because the
# migrations were a loop in a README that nobody had run.
#
# What deploys is therefore not gated on this workflow. What gates it is the
# pull request: GitHub runs these checks on the merge result, and `main` is
# protected so a red one cannot be merged and nothing lands without a pull
# request. The browser suite and the pipeline's tests run here and nowhere
# else — Cloudflare's builder has no Chromium and no Python.
name: Tests

on:
  push:
  pull_request:
  # The Regenerate workflow dispatches this one on the branch it pushes.
  # GitHub starts no workflow for a push or a pull request made with a
  # workflow's own token — its guard against runaway automation — but a
  # dispatch is the named exception, and the checks it makes land on the
  # branch's head commit, which is what the branch protection reads.
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            server/package-lock.json

      - name: Install
        run: npm run install:all

      # Lint and typecheck before the tests: a type error is the kind of
      # failure that makes every test below it fail for the wrong reason.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      # The browser suite needs the build above and a Chromium, which the
      # runner already has. It is the only place the app is exercised as a
      # person uses it: the database, the layout and the audio at once.
      - name: Browser tests
        working-directory: app
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pipeline
        run: pip install -e . pytest
      - name: Pipeline tests
        run: python -m pytest tests/ -q
