# Tests only. Deployment is Cloudflare's job: Workers Builds watches this repo
# and deploys on push, so nothing here needs a Cloudflare credential.
#
# The app tests also run on Cloudflare's builder as part of the build command,
# which is what actually blocks a bad deploy. These run the pipeline tests too,
# which the builder has no Python for, and give pull requests a status check.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: App tests
        working-directory: app
        run: npm test
      - name: App builds
        working-directory: app
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pipeline
        run: pip install -e . pytest
      - name: Pipeline tests
        run: python -m pytest tests/ -q
