# Every check, then the deploy.
#
# The tests run on every push and pull request. A push to main that passes
# all of them — the app's, the server's, the browser's and the pipeline's —
# is then deployed from here: the database migrations first, the Worker
# second, so the code never runs ahead of the schema it reads. It used to be
# Cloudflare's Workers Builds that deployed, on push, running the app's tests
# but never a migration; the first sync after the themes went out answered
# "no such table: themes". Nothing deploys without the deploy job's two
# secrets, and nothing deploys red.
name: Tests

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            server/package-lock.json

      - name: Install
        run: npm run install:all

      # Lint and typecheck before the tests: a type error is the kind of
      # failure that makes every test below it fail for the wrong reason.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

      # The browser suite needs the build above and a Chromium, which the
      # runner already has. It is the only place the app is exercised as a
      # person uses it: the database, the layout and the audio at once.
      - name: Browser tests
        working-directory: app
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pipeline
        run: pip install -e . pytest
      - name: Pipeline tests
        run: python -m pytest tests/ -q

  deploy:
    # Only main, only after every check above, and one at a time: two pushes
    # in quick succession must not race each other into the database.
    needs: [app, pipeline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            server/package-lock.json
      - name: Install
        run: npm run install:all

      - name: Credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as repository secrets; nothing was deployed."
            exit 1
          fi

      - name: Build the app
        working-directory: app
        run: npm run build

      # The schema before the code: a Worker that reads a table its database
      # does not have yet is the outage this job exists to prevent.
      - name: Migrations pending
        run: npx wrangler d1 migrations list frcog --remote
      - name: Apply migrations
        run: npx wrangler d1 migrations apply frcog --remote
      - name: Deploy
        run: npx wrangler deploy
